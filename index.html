<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farm Manager</title>
    <meta name="description" content="Field, program, inventory and cost management for a row-crop operation." />
    <!--
      Three tags from the Bolt starter were removed here on 6 Sep 2026, when the app moved
      to Netlify: two share images pointing at bolt.new's branding, and a favicon link to a
      /vite.svg this project never contained.

      The icon is back as a real one (22 Sep 2026): the sidebar's Wheat logo, as an SVG
      favicon plus the PNGs a home-screen install needs. The manifest says
      display "minimal-ui", NOT "standalone", on purpose — Android keeps a back button
      (WI-29's whole point on a phone) and iOS treats it as a Safari bookmark with a proper
      icon. Full-screen "standalone" is a one-word change once the reports, which open as
      blob pages in a new window, have been tried in an installed app on a real phone.
    -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="apple-mobile-web-app-title" content="Farm Manager" />
    <meta property="og:title" content="Farm Manager" />
    <meta property="og:description" content="Field, program, inventory and cost management for a row-crop operation." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
